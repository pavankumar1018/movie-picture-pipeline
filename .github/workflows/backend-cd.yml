name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
      - '.github/actions/setup-backend/**'

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run linter
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run test suite
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag mp-backend:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            mp-backend:${{ github.sha }} \
            -o /tmp/mp-backend.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp/mp-backend.tar
          retention-days: 1

  deploy:
    name: Deploy to Kubernetes
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/mp-backend.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          docker tag \
            mp-backend:${IMAGE_TAG} \
            ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Deploy manifests with kustomize
        working-directory: starter/backend/k8s
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          kustomize edit set image \
            backend=${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          kustomize build | kubectl apply -f -

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            --timeout=180s

  notify-on-failure:
    name: Notify on failure
    needs:
      - lint
      - test
      - build
      - deploy
    if: failure()
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Open a GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backend CD failed on ${context.sha.substring(0,7)}`,
              body: `The Backend Continuous Deployment workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`,
              labels: ["ci-failure", "backend"]
            })