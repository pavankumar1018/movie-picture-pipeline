name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/setup-backend/**'

  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run linter
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Run test suite
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag mp-backend:${{ github.sha }} \
            .

  notify-on-failure:
    name: Notify on failure
    needs:
      - lint
      - test
      - build
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Backend CI failed** for commit \`${context.sha.substring(0,7)}\`.\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })